# 경제 이벤트 → 관련 섹터/ETF 매핑
#
# 섹터명은 src/collection/stock_fetcher.py의 TICKERS 키와 일치해야 한다.
# 주가 시계열이 없는 섹터는 패널 회귀에서 통째로 빠지므로, 실제 ETF가
# 존재하는 이름만 쓴다.
#
# 이전 매핑의 유통/식품/내수소비/서비스/조선은 대응 ETF가 없어 소비자물가·
# 물가_인상·고용동향·최저임금 4개 이벤트가 패널에서 제외됐다. 아래로 교체:
#   유통, 식품   → 필수소비재 (TIGER 200 생활소비재, 2015-09~)
#   내수소비     → 경기소비재 (TIGER 경기소비재, 2011-04~)
#   서비스       → 여행레저   (TIGER 여행레저, 2015-10~)
#   조선         → 조선       (KODEX 조선, 2009-04~)
# 부동산은 장기 시계열 ETF가 없어 제외했다. 부동산이 붙던 이벤트는 모두
# 건설 또는 은행을 함께 갖고 있어 커버리지 손실이 없다.

event_sector_map:
  GDP_성장률:
    - KOSPI
    - KODEX200
  기준금리:
    - 은행
    - 보험
    - 건설
  소비자물가:
    - 필수소비재
    - 경기소비재
  수출입동향:
    - 반도체
    - 자동차
    - 조선
  고용동향:
    - 여행레저
    - 경기소비재
  부동산가격:
    - 건설
    - 은행
  환율_달러:
    - 반도체
    - 자동차
    - 조선
    - KOSPI
  반도체_수출:
    - 반도체
    - KOSPI
    - KODEX200
  가계부채:
    - 은행
    - 경기소비재
  경상수지:
    - 반도체
    - 자동차
    - KOSPI
  국채_금리:
    - 은행
    - 보험
    - 건설
  물가_인상:
    - 필수소비재
    - 경기소비재
  경기침체:
    - KOSPI
    - KODEX200
    - 경기소비재
  부동산_대출:
    - 건설
    - 은행
  최저임금:
    - 여행레저
    - 경기소비재
    - 필수소비재

# 이벤트 스터디 윈도우 설정
event_study:
  estimation_window: [-120, -11]   # 정상 수익률 추정 기간
  event_window: [-10, 10]          # 이벤트 윈도우
  car_window: [-1, 5]             # CAR 측정 구간

# 프레이밍 유형 분류
framing_types:
  - optimistic      # 낙관적
  - pessimistic     # 비관적
  - alarmist        # 경고적
  - defensive       # 방어적
  - comparative     # 비교적
  - neutral         # 중립적

# 편향 점수 가중치
bias_weights:
  framing_type: 0.4    # α
  sentiment: 0.35      # β
  keyword_polarity: 0.25  # γ
